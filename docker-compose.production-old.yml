# Docker Compose for Local Testing
# Simulates GCP Cloud Run environment

services:
  # PostgreSQL Database (similar to Cloud SQL)
  postgres:
    image: postgres:15-alpine
    container_name: chatwoot-postgres
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - cloudflare_rhaps_prod_net
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot_user
      POSTGRES_PASSWORD: cacVej-beghoz-tuzjo6
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot_user -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (similar to Cloud Memorystore)
  redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - cloudflare_rhaps_prod_net
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Rails Web Application
  web:
    image: chatwoot:production-web
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: chatwoot-web
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - cloudflare_rhaps_prod_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Rails Configuration
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-dummy_secret_key_base_for_testing_only_replace_in_production}"

      # Apple Maps Server API
      APPLE_MAPS_TEAM_ID: "${APPLE_MAPS_TEAM_ID}"
      APPLE_MAPS_KEY_ID: "${APPLE_MAPS_KEY_ID}"
      APPLE_MAPS_PRIVATE_KEY: "${APPLE_MAPS_PRIVATE_KEY}"

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot_production
      POSTGRES_USERNAME: chatwoot_user
      POSTGRES_PASSWORD: cacVej-beghoz-tuzjo6

      # Redis Configuration
      REDIS_URL: redis://redis:6379

      # Application Configuration
      FRONTEND_URL: https://msp.rhaps.net
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "false"

      # Storage Configuration (local for testing)
      ACTIVE_STORAGE_SERVICE: local

      # SMTP Configuration for sending emails
      SMTP_DOMAIN: icloud.com
      SMTP_ADDRESS: smtp.mail.me.com
      SMTP_PORT: 587
      SMTP_USERNAME: rhaps@icloud.com
      SMTP_PASSWORD: ymwf-naww-acri-cdkc
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      SMTP_OPENSSL_VERIFY_MODE: peer

      # Mailer Configuration
      MAILER_SENDER_EMAIL: "Chatwoot <rhaps@icloud.com>"

      # Apple Pay Configuration
      APPLE_PAY_MERCHANT_DOMAIN: "${APPLE_PAY_MERCHANT_DOMAIN}"
      APPLE_PAY_MERCHANT_IDENTIFIER: "${APPLE_PAY_MERCHANT_IDENTIFIER}"
      APPLE_PAY_TEST_MODE: "${APPLE_PAY_TEST_MODE}"

    ports:
      - "3000:8080"
    volumes:
      - ./storage:/app/storage
      - ./log:/app/log
      - ./tmp:/app/tmp
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        bundle exec rails db:prepare &&
        echo 'Database ready! Starting web server...' &&
        rm -f /app/tmp/pids/server.pid &&
        bundle exec rails server -b 0.0.0.0 -p 8080
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Sidekiq Worker
  worker:
    image: chatwoot:production-worker
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: chatwoot-worker
    hostname: chatwoot-worker
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - cloudflare_rhaps_prod_net
    ports:
      - "7433:7433"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      # Same environment as web service
      RAILS_ENV: production
      HOSTNAME: chatwoot-worker
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-dummy_secret_key_base_for_testing_only_replace_in_production}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot_production
      POSTGRES_USERNAME: chatwoot_user
      POSTGRES_PASSWORD: cacVej-beghoz-tuzjo6
      REDIS_URL: redis://redis:6379
      ACTIVE_STORAGE_SERVICE: local

      # Apple Maps Server API
      APPLE_MAPS_TEAM_ID: "${APPLE_MAPS_TEAM_ID}"
      APPLE_MAPS_KEY_ID: "${APPLE_MAPS_KEY_ID}"
      APPLE_MAPS_PRIVATE_KEY: "${APPLE_MAPS_PRIVATE_KEY}"

      # Frontend URL for email links
      FRONTEND_URL: https://msp.rhaps.net

      # SMTP Configuration for sending emails
      SMTP_DOMAIN: icloud.com
      SMTP_ADDRESS: smtp.mail.me.com
      SMTP_PORT: 587
      SMTP_USERNAME: rhaps@icloud.com
      SMTP_PASSWORD: ymwf-naww-acri-cdkc
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      SMTP_OPENSSL_VERIFY_MODE: peer
      MAILER_SENDER_EMAIL: "Chatwoot <rhaps@icloud.com>"

      # Apple Pay Configuration
      APPLE_PAY_MERCHANT_DOMAIN: "${APPLE_PAY_MERCHANT_DOMAIN}"
      APPLE_PAY_MERCHANT_IDENTIFIER: "${APPLE_PAY_MERCHANT_IDENTIFIER}"
      APPLE_PAY_TEST_MODE: "${APPLE_PAY_TEST_MODE}"
    volumes:
      - ./storage:/app/storage
      - ./log:/app/log
      - ./tmp:/app/tmp
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cloudflare_rhaps_prod_net:
    external: true
    name: cloudflare_rhaps_prod_net
